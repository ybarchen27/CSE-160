// MINI MATRIX LIBRARY (subset of cuon-matrix.js)
// ═══════════════════════════════════════════════════
class Matrix4 {
  constructor(src) {
    this.elements = new Float32Array(16);
    if (src instanceof Matrix4) this.elements.set(src.elements);
    else this.setIdentity();
  }
  setIdentity() {
    const e = this.elements;
    e.fill(0); e[0]=e[5]=e[10]=e[15]=1; return this;
  }
  set(src) { this.elements.set(src.elements); return this; }
  concat(other) {
    const a=this.elements, b=other.elements, r=new Float32Array(16);
    for(let i=0;i<4;i++) for(let j=0;j<4;j++) {
      let s=0; for(let k=0;k<4;k++) s+=a[i+k*4]*b[k+j*4]; r[i+j*4]=s;
    }
    this.elements=r; return this;
  }
  multiply(other){return new Matrix4(this).concat(other);}
  setTranslate(x,y,z){
    this.setIdentity(); const e=this.elements;
    e[12]=x;e[13]=y;e[14]=z; return this;
  }
  translate(x,y,z){return this.concat(new Matrix4().setTranslate(x,y,z));}
  setScale(x,y,z){
    this.setIdentity(); const e=this.elements;
    e[0]=x;e[5]=y;e[10]=z; return this;
  }
  scale(x,y,z){return this.concat(new Matrix4().setScale(x,y,z));}
  setRotate(angle,x,y,z){
    const rad=angle*Math.PI/180, c=Math.cos(rad), s=Math.sin(rad);
    const len=Math.hypot(x,y,z); x/=len;y/=len;z/=len;
    const e=this.elements;
    e[0]=x*x*(1-c)+c;  e[4]=x*y*(1-c)-z*s;e[8] =x*z*(1-c)+y*s;e[12]=0;
    e[1]=x*y*(1-c)+z*s;e[5]=y*y*(1-c)+c;  e[9] =y*z*(1-c)-x*s;e[13]=0;
    e[2]=x*z*(1-c)-y*s;e[6]=y*z*(1-c)+x*s;e[10]=z*z*(1-c)+c;  e[14]=0;
    e[3]=0;e[7]=0;e[11]=0;e[15]=1; return this;
  }
  setLookAt(ex,ey,ez,cx,cy,cz,ux,uy,uz){
    let fx=cx-ex,fy=cy-ey,fz=cz-ez;
    let fl=Math.hypot(fx,fy,fz)||1; fx/=fl;fy/=fl;fz/=fl;
    let rx=uy*fz-uz*fy,ry=uz*fx-ux*fz,rz=ux*fy-uy*fx;
    let rl=Math.hypot(rx,ry,rz)||1; rx/=rl;ry/=rl;rz/=rl;
    let tx=ry*fz-rz*fy,ty=rz*fx-rx*fz,tz=rx*fy-ry*fx;
    const e=this.elements;
    e[0]=rx;e[1]=tx;e[2]=-fx;e[3]=0;
    e[4]=ry;e[5]=ty;e[6]=-fy;e[7]=0;
    e[8]=rz;e[9]=tz;e[10]=-fz;e[11]=0;
    e[12]=-(rx*ex+ry*ey+rz*ez);
    e[13]=-(tx*ex+ty*ey+tz*ez);
    e[14]= (fx*ex+fy*ey+fz*ez);
    e[15]=1; return this;
  }
  setPerspective(fov,aspect,near,far){
    const f=1/Math.tan(fov*Math.PI/360);
    const nf=1/(near-far);
    const e=this.elements; e.fill(0);
    e[0]=f/aspect;e[5]=f;e[10]=(far+near)*nf;e[11]=-1;e[14]=2*far*near*nf;
    return this;
  }
  multiplyVector3(v){
    const e=this.elements,x=v.x,y=v.y,z=v.z;
    return {
      x:e[0]*x+e[4]*y+e[8]*z+e[12],
      y:e[1]*x+e[5]*y+e[9]*z+e[13],
      z:e[2]*x+e[6]*y+e[10]*z+e[14]
    };
  }
}

// ═══════════════════════════════════════════════════
// VECTOR3 (simple object, not a class)
// ═══════════════════════════════════════════════════
function vec3(x,y,z){return {x,y,z};}
function v3copy(v){return {x:v.x,y:v.y,z:v.z};}
function v3add(a,b){return {x:a.x+b.x,y:a.y+b.y,z:a.z+b.z};}
function v3sub(a,b){return {x:a.x-b.x,y:a.y-b.y,z:a.z-b.z};}
function v3scale(v,s){return {x:v.x*s,y:v.y*s,z:v.z*s};}
function v3norm(v){const l=Math.hypot(v.x,v.y,v.z)||1;return {x:v.x/l,y:v.y/l,z:v.z/l};}
function v3cross(a,b){return{x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x};}

// CAMERA
// ═══════════════════════════════════════════════════
class Camera {
  constructor(canvas){
    this.fov=60;
    this.eye=vec3(16,1.5,28);
    this.at =vec3(16,1.5,27);
    this.up =vec3(0,1,0);
    this.canvas=canvas;
    this.viewMatrix=new Matrix4();
    this.projectionMatrix=new Matrix4();
    this._updateView();
    this._updateProj();
  }
  _forward(){return v3norm(v3sub(this.at,this.eye));}
  _right(){return v3norm(v3cross(this._forward(),this.up));}
  _updateView(){
    const e=this.eye,a=this.at,u=this.up;
    this.viewMatrix.setLookAt(e.x,e.y,e.z,a.x,a.y,a.z,u.x,u.y,u.z);
  }
  _updateProj(){
    this.projectionMatrix.setPerspective(this.fov,this.canvas.width/this.canvas.height,0.1,1000);
  }
  moveForward(spd=0.15){
    const f=v3scale(this._forward(),spd);
    this.eye=v3add(this.eye,f);this.at=v3add(this.at,f);this._updateView();
  }
  moveBackwards(spd=0.15){
    const f=v3scale(this._forward(),-spd);
    this.eye=v3add(this.eye,f);this.at=v3add(this.at,f);this._updateView();
  }
  moveLeft(spd=0.15){
    const s=v3scale(this._right(),-spd);
    this.eye=v3add(this.eye,s);this.at=v3add(this.at,s);this._updateView();
  }
  moveRight(spd=0.15){
    const s=v3scale(this._right(),spd);
    this.eye=v3add(this.eye,s);this.at=v3add(this.at,s);this._updateView();
  }
  panLeft(alpha=3){this._pan(alpha);}
  panRight(alpha=3){this._pan(-alpha);}
  _pan(deg){
    const f=this._forward();
    const rot=new Matrix4().setRotate(deg,this.up.x,this.up.y,this.up.z);
    const fp=rot.multiplyVector3(f);
    this.at={x:this.eye.x+fp.x,y:this.eye.y+fp.y,z:this.eye.z+fp.z};
    this._updateView();
  }
  mouseLook(dx,dy){
    const sens=0.18;
    this._pan(dx*sens);
    // pitch
    const f=this._forward(),r=this._right();
    const rot=new Matrix4().setRotate(-dy*sens,r.x,r.y,r.z);
    const fp=rot.multiplyVector3(f);
    const len=Math.hypot(fp.x,fp.y,fp.z)||1;
    fp.x/=len;fp.y/=len;fp.z/=len;
    if(Math.abs(fp.y)>0.97)return;
    this.at={x:this.eye.x+fp.x,y:this.eye.y+fp.y,z:this.eye.z+fp.z};
    this._updateView();
  }
}

// SHADERS

const VSHADER=`
attribute vec4 a_Pos;
attribute vec2 a_UV;
uniform mat4 u_M, u_V, u_P;
varying vec2 v_UV;
void main(){
  gl_Position = u_P * u_V * u_M * a_Pos;
  v_UV = a_UV;
}`;

const FSHADER=`
precision mediump float;
uniform sampler2D u_Tex0, u_Tex1, u_Tex2;
uniform int   u_TexIdx;
uniform vec4  u_Color;
uniform float u_Weight;
varying vec2 v_UV;
void main(){
  vec4 tc;
  if(u_TexIdx==0)      tc=texture2D(u_Tex0,v_UV);
  else if(u_TexIdx==1) tc=texture2D(u_Tex1,v_UV);
  else                 tc=texture2D(u_Tex2,v_UV);
  gl_FragColor = (1.0-u_Weight)*u_Color + u_Weight*tc;
}`;

// ═══════════════════════════════════════════════════
// WEBGL SETUP HELPERS
// ═══════════════════════════════════════════════════
function compileShader(gl,type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))
    throw gl.getShaderInfoLog(s);
  return s;
}
function createProgram(gl,vs,fs){
  const p=gl.createProgram();
  gl.attachShader(p,vs);gl.attachShader(p,fs);
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))
    throw gl.getProgramInfoLog(p);
  return p;
}

// ═══════════════════════════════════════════════════
// PROCEDURAL TEXTURES
// ═══════════════════════════════════════════════════
function makeTexture(gl,drawFn,size=128){
  const c=document.createElement('canvas');
  c.width=c.height=size;
  drawFn(c.getContext('2d'),size);
  const t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,1);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  return t;
}

function drawBrick(ctx,s){
  ctx.fillStyle='#7a3b1e'; ctx.fillRect(0,0,s,s);
  const bw=s/4,bh=s/8;
  for(let r=0;r<s/bh+1;r++){
    const off=(r%2)*(bw/2);
    for(let c=-1;c<s/bw+1;c++){
      const x=c*bw+off,y=r*bh;
      ctx.fillStyle=`hsl(${15+Math.random()*10},${50+Math.random()*15}%,${40+Math.random()*15}%)`;
      ctx.fillRect(x+2,y+2,bw-4,bh-4);
    }
  }
}

function drawGrass(ctx,s){
  ctx.fillStyle='#3a7d44'; ctx.fillRect(0,0,s,s);
  for(let i=0;i<120;i++){
    const x=Math.random()*s,y=Math.random()*s,r=2+Math.random()*9;
    ctx.fillStyle=`hsl(${110+Math.random()*30},${50+Math.random()*20}%,${25+Math.random()*20}%)`;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
}

function drawSky(ctx,s){
  const g=ctx.createLinearGradient(0,0,0,s);
  g.addColorStop(0,'#1565c0');g.addColorStop(0.5,'#42a5f5');g.addColorStop(1,'#e3f2fd');
  ctx.fillStyle=g;ctx.fillRect(0,0,s,s);
  ctx.fillStyle='rgba(255,255,255,0.85)';
  for(let i=0;i<6;i++){
    const cx=Math.random()*s,cy=Math.random()*s*.45;
    for(let j=0;j<4;j++){
      const r=8+Math.random()*14;
      ctx.beginPath();ctx.arc(cx+j*10-15,cy+Math.random()*8,r,0,Math.PI*2);ctx.fill();
    }
  }
}

const tex0=makeTexture(gl,drawBrick);   // wall/brick  → unit 0
const tex1=makeTexture(gl,drawGrass);   // ground      → unit 1
const tex2=makeTexture(gl,drawSky);     // sky         → unit 2

gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tex0);
gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,tex1);
gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,tex2);
gl.uniform1i(loc.uT0,0); gl.uniform1i(loc.uT1,1); gl.uniform1i(loc.uT2,2);

// GL state
gl.enable(gl.DEPTH_TEST);
gl.enable(gl.CULL_FACE);
gl.clearColor(0.53,0.81,0.98,1);

// Camera
const camera=new Camera(canvas);

// ─── Draw a single cube ───────────────────────────
const mMat=new Matrix4();
function drawCube(tx,ty,tz,sx,sy,sz,texIdx,color){
  mMat.setIdentity();
  mMat.translate(tx,ty,tz);
  mMat.scale(sx,sy,sz);
  gl.uniformMatrix4fv(loc.uM,false,mMat.elements);
  if(texIdx>=0){
    gl.uniform1i(loc.uTI,texIdx);
    gl.uniform1f(loc.uW,1.0);
  } else {
    gl.uniform1i(loc.uTI,0);
    gl.uniform1f(loc.uW,0.0);
    gl.uniform4fv(loc.uCol,color);
  }
  gl.bindBuffer(gl.ARRAY_BUFFER,vBuf);
  gl.vertexAttribPointer(loc.aPos,3,gl.FLOAT,false,0,0);
  gl.enableVertexAttribArray(loc.aPos);
  gl.bindBuffer(gl.ARRAY_BUFFER,uvBuf);
  gl.vertexAttribPointer(loc.aUV,2,gl.FLOAT,false,0,0);
  gl.enableVertexAttribArray(loc.aUV);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,iBuf);
  gl.drawElements(gl.TRIANGLES,36,gl.UNSIGNED_SHORT,0);
}

// ─── Render scene ─────────────────────────────────
function render(){
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.uniformMatrix4fv(loc.uV,false,camera.viewMatrix.elements);
  gl.uniformMatrix4fv(loc.uP,false,camera.projectionMatrix.elements);

  // Sky box
  drawCube(16,0,16, 900,900,900, 2, null);

  // Ground
  drawCube(16,-0.05,16, 32,0.1,32, 1, null);

  // World walls
  for(let z=0;z<32;z++){
    for(let x=0;x<32;x++){
      const h=g_map[z][x];
      if(!h) continue;
      for(let y=0;y<h;y++){
        drawCube(x+.5, y+.5, z+.5, 1,1,1, 0, null);
      }
    }
  }
}

// ─── Input ────────────────────────────────────────
const keys={};
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyF') modifyBlock(true);
  if(e.code==='KeyG') modifyBlock(false);
});
document.addEventListener('keyup',e=>keys[e.code]=false);

canvas.addEventListener('click',()=>canvas.requestPointerLock());
document.addEventListener('pointerlockchange',()=>{
  const locked=document.pointerLockElement===canvas;
  document.getElementById('hud').textContent=
    locked ? 'Mouse captured – press Esc to release'
           : 'Virtual World Explorer | Click canvas to capture mouse';
});
document.addEventListener('mousemove',e=>{
  if(document.pointerLockElement===canvas) camera.mouseLook(e.movementX,e.movementY);
});

function modifyBlock(add){
  const f=camera._forward();
  const tx=Math.floor(camera.eye.x+f.x*1.5);
  const tz=Math.floor(camera.eye.z+f.z*1.5);
  if(tx<0||tx>=32||tz<0||tz>=32) return;
  if(add){if(g_map[tz][tx]<4) g_map[tz][tx]++;}
  else  {if(g_map[tz][tx]>0) g_map[tz][tx]--;}
}

// ─── Game loop ────────────────────────────────────
function tick(){
  if(keys['KeyW']||keys['ArrowUp'])    camera.moveForward();
  if(keys['KeyS']||keys['ArrowDown'])  camera.moveBackwards();
  if(keys['KeyA']||keys['ArrowLeft'])  camera.moveLeft();
  if(keys['KeyD']||keys['ArrowRight']) camera.moveRight();
  if(keys['KeyQ']) camera.panLeft();
  if(keys['KeyE']) camera.panRight();
  render();
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
